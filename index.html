<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NotaKu</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;
    color:#f8fafc;
    background:
        radial-gradient(circle at 15% 10%,#263b70 0,transparent 28%),
        radial-gradient(circle at 90% 15%,#4c1d72 0,transparent 25%),
        linear-gradient(145deg,#080b14,#111827 55%,#080b12);
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(#ffffff04 1px,transparent 1px),
        linear-gradient(90deg,#ffffff04 1px,transparent 1px);
    background-size:35px 35px;
}

.container{
    width:min(920px,100%);
    margin:auto;
    padding:24px 16px 50px;
    position:relative;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:46px;
    height:46px;
    display:grid;
    place-items:center;
    border-radius:14px;
    font-size:22px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    box-shadow:0 10px 30px #6366f144;
}

.logo h1{
    margin:0;
    font-size:22px;
    font-weight:800;
}

.logo p{
    margin:3px 0 0;
    color:#94a3b8;
    font-size:12px;
}

.badge{
    padding:8px 12px;
    border:1px solid #ffffff12;
    border-radius:999px;
    background:#ffffff08;
    color:#a5b4fc;
    font-size:11px;
    font-weight:700;
}

/* CARD */

.card{
    background:linear-gradient(145deg,#151c2b,#101622);
    border:1px solid #ffffff0e;
    border-radius:22px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:
        0 20px 60px #0005,
        inset 0 1px #ffffff08;
}

.section-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.section-number{
    width:30px;
    height:30px;
    display:grid;
    place-items:center;
    border-radius:9px;
    background:#6366f120;
    color:#a5b4fc;
    font-size:13px;
    font-weight:800;
}

.section-title h2{
    margin:0;
    font-size:15px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:#94a3b8;
    font-size:11px;
    font-weight:700;
    letter-spacing:.5px;
}

input{
    width:100%;
    border:1px solid #ffffff10;
    outline:none;
    border-radius:12px;
    padding:13px 14px;
    background:#090e18;
    color:white;
    font:inherit;
    font-size:13px;
    transition:.2s;
}

input::placeholder{
    color:#475569;
}

input:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 3px #6366f118;
}

/* ITEMS */

.items-head{
    display:grid;
    grid-template-columns:2fr .6fr 1.1fr 42px;
    gap:8px;
    color:#64748b;
    font-size:10px;
    font-weight:700;
    margin-bottom:7px;
}

.item{
    display:grid;
    grid-template-columns:2fr .6fr 1.1fr 42px;
    gap:8px;
    margin-bottom:8px;
    animation:slide .2s ease;
}

@keyframes slide{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.item input{
    margin:0;
}

.delete{
    border:1px solid #ef444422;
    background:#ef444412;
    color:#f87171;
    border-radius:11px;
    font-size:18px;
    cursor:pointer;
}

.delete:hover{
    background:#ef444425;
}

.add{
    width:100%;
    margin-top:5px;
    padding:13px;
    border:1px dashed #6366f155;
    border-radius:12px;
    background:#6366f10c;
    color:#a5b4fc;
    font:inherit;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.add:hover{
    background:#6366f11a;
}

/* TOTAL */

.total-box{
    margin-top:20px;
    padding:18px;
    border-radius:16px;
    background:#090e18;
    border:1px solid #ffffff08;
}

.total-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.total-label{
    color:#94a3b8;
    font-size:12px;
}

.total-value{
    font-size:24px;
    font-weight:800;
    background:linear-gradient(90deg,#a5b4fc,#c084fc);
    -webkit-background-clip:text;
    color:transparent;
}

.download{
    width:100%;
    margin-top:12px;
    padding:15px;
    border:0;
    border-radius:13px;
    color:white;
    font:inherit;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    box-shadow:0 12px 30px #6366f133;
    transition:.2s;
}

.download:hover{
    transform:translateY(-1px);
    box-shadow:0 16px 35px #6366f144;
}

.download:active{
    transform:scale(.99);
}

.footer{
    text-align:center;
    color:#475569;
    font-size:10px;
    margin-top:20px;
}

/* RECEIPT */

#receipt{
    position:absolute;
    left:-99999px;
    top:0;
    width:80mm;
    padding:5mm;
    background:white;
    color:#000;
    font-family:"Courier New",monospace;
    font-size:12px;
}

#receipt h2{
    text-align:center;
    margin:0 0 4px;
    font-size:18px;
}

.center{
    text-align:center;
}

.line{
    border-top:1px dashed #000;
    margin:10px 0;
}

.receipt-item{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.item-name{
    margin-bottom:2px;
    font-weight:bold;
    word-break:break-word;
}

.thanks{
    text-align:center;
    line-height:1.5;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:18px 12px 40px;
    }

    .header{
        margin-bottom:16px;
    }

    .badge{
        display:none;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:16px;
        border-radius:18px;
    }

    .items-head{
        display:none;
    }

    .item{
        grid-template-columns:1fr 58px 105px 40px;
    }

    .logo h1{
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">

<div class="logo">

<div class="logo-icon">🧾</div>

<div>
<h1>NotaKu</h1>
<p>buat nota jadi lebih simpel</p>
</div>

</div>

<div class="badge">
AUTO PDF • 80MM
</div>

</header>


<!-- INFORMASI -->

<div class="card">

<div class="section-title">

<div class="section-number">01</div>

<h2>Informasi Nota</h2>

</div>


<div class="grid">

<div class="field">

<label>NAMA TOKO</label>

<input
id="store"
placeholder="Nama toko kamu">

</div>


<div class="field">

<label>NAMA PEMBELI</label>

<input
id="customer"
placeholder="Nama pembeli">

</div>


<div class="field">

<label>TANGGAL</label>

<input
type="date"
id="date">

</div>

</div>

</div>


<!-- BARANG -->

<div class="card">

<div class="section-title">

<div class="section-number">02</div>

<h2>Daftar Barang</h2>

</div>


<div class="items-head">

<span>BARANG</span>
<span>QTY</span>
<span>HARGA</span>
<span></span>

</div>


<div id="items"></div>


<button class="add" onclick="addItem()">
＋ Tambah Barang
</button>


<div class="total-box">

<div class="total-row">

<span class="total-label">
TOTAL PEMBAYARAN
</span>

<span class="total-value" id="total">
Rp0
</span>

</div>

</div>


<button class="download" onclick="downloadPDF()">
↓ &nbsp; Download Nota PDF
</button>

</div>


<div class="footer">
NotaKu • nota otomatis &amp; rapi
</div>

</div>


<!-- RECEIPT -->

<div id="receipt">

<h2 id="rStore">NAMA TOKO</h2>

<div class="center">

<div id="rInvoice">#1</div>

<div id="rDate"></div>

<div id="rCustomer"></div>

</div>

<div class="line"></div>

<div id="rItems"></div>

<div class="line"></div>

<div class="receipt-item">

<span>Subtotal</span>

<span id="rSubtotal">Rp0</span>

</div>

<div class="line"></div>

<div class="receipt-item" style="font-size:15px">

<b>TOTAL</b>

<b id="rTotal">Rp0</b>

</div>

<div class="line"></div>

<div class="thanks">

TERIMA KASIH<br>
BARANG YANG SUDAH DIBELI<br>
TIDAK DAPAT DIKEMBALIKAN

</div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<script>

const itemsBox=document.getElementById("items");

const today=new Date();

document.getElementById("date").value=
today.toISOString().split("T")[0];


/* NOMOR NOTA */

let invoiceNumber=
parseInt(
localStorage.getItem("invoiceNumber")||"1"
);

document.getElementById("rInvoice").textContent=
"#"+invoiceNumber;


function rupiah(n){

return "Rp"+
Number(n||0).toLocaleString("id-ID");

}


function addItem(){

const div=document.createElement("div");

div.className="item";

div.innerHTML=`

<input
class="name"
placeholder="Nama barang"
oninput="calculate()">

<input
class="qty"
type="number"
value="1"
min="1"
oninput="calculate()">

<input
class="price"
type="number"
value="0"
placeholder="Harga"
oninput="calculate()">

<button
class="delete"
onclick="this.parentElement.remove();calculate()">
×
</button>

`;

itemsBox.appendChild(div);

calculate();

}


function calculate(){

let subtotal=0;


document.querySelectorAll(".item")
.forEach(row=>{

const qty=
Number(
row.querySelector(".qty").value
)||0;

const price=
Number(
row.querySelector(".price").value
)||0;

subtotal+=qty*price;

});


document.getElementById("total")
.textContent=rupiah(subtotal);

updateReceipt(subtotal);

}


function updateReceipt(subtotal){

document.getElementById("rStore")
.textContent=
document.getElementById("store").value||
"NAMA TOKO";


document.getElementById("rInvoice")
.textContent=
"#"+invoiceNumber;


document.getElementById("rCustomer")
.textContent=
"Pembeli: "+
(
document.getElementById("customer").value||"-"
);


const date=
document.getElementById("date").value;


document.getElementById("rDate")
.textContent=

date
?
new Date(date+"T00:00:00")
.toLocaleDateString("id-ID")
:
"-";


const rItems=
document.getElementById("rItems");

rItems.innerHTML="";


document.querySelectorAll(".item")
.forEach(row=>{

const name=
row.querySelector(".name").value||
"Barang";

const qty=
Number(
row.querySelector(".qty").value
)||0;

const price=
Number(
row.querySelector(".price").value
)||0;


if(qty>0){

const div=
document.createElement("div");

div.innerHTML=`

<div class="item-name">
${escapeHTML(name)}
</div>

<div class="receipt-item">

<span>
${qty} x ${rupiah(price)}
</span>

<span>
${rupiah(qty*price)}
</span>

</div>

<div style="height:6px"></div>
`;

rItems.appendChild(div);

}

});


document.getElementById("rSubtotal")
.textContent=rupiah(subtotal);

document.getElementById("rTotal")
.textContent=rupiah(subtotal);

}


function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


async function downloadPDF(){

calculate();

const receipt=
document.getElementById("receipt");


await new Promise(resolve=>
setTimeout(resolve,100)
);


const canvas=
await html2canvas(receipt,{

scale:3,

backgroundColor:"#ffffff",

useCORS:true,

logging:false

});


const imgWidth=80;

const ratio=
canvas.height/canvas.width;

const imgHeight=
imgWidth*ratio;


const {jsPDF}=
window.jspdf;


const pdf=
new jsPDF({

orientation:"portrait",

unit:"mm",

format:[imgWidth,imgHeight],

compress:true

});


pdf.addImage(

canvas.toDataURL("image/png"),

"PNG",

0,
0,
imgWidth,
imgHeight,

undefined,
"FAST"

);


pdf.save(
"nota-#"+invoiceNumber+".pdf"
);


/* nomor berikutnya */

invoiceNumber++;

localStorage.setItem(
"invoiceNumber",
invoiceNumber
);

document.getElementById("rInvoice")
.textContent="#"+invoiceNumber;

}


/* realtime */

document
.querySelectorAll("#store,#customer,#date")
.forEach(el=>{

el.addEventListener(
"input",
calculate
);

});


/* barang pertama */

addItem();

</script>

</body>
</html>
